name: Litegram APK

on:
  workflow_dispatch:
  push:
    branches: [ litegram ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK + CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Local properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Litegram (arm64 debug)
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --max-workers=4 --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: litegram-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
